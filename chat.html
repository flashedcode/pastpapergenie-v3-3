<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat - pastpapergenie v3</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="styles.css" />
<meta name="monetag" content="15a3704e2aea6a5d47439bb5b4b6c144">
<script src="theme.js"></script>
<style>
#auth{display:flex;flex:1;align-items:center;justify-content:center;padding:16px;background:var(--page)}
.card{width:100%;max-width:340px;padding:0 12px 6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden}
.card h1,aside h2{margin:0 -12px 8px;padding:4px 12px;font:bold 13px var(--font);color:#fff;background:linear-gradient(var(--bar1),var(--bar2));text-shadow:0 1px 1px rgba(0,0,0,.45)}
aside h2{margin:0 0 4px;padding:4px 10px}
.card label{display:block;margin:8px 0 2px}
input{font:inherit;padding:3px 6px;border:1px solid var(--bline);border-radius:var(--r);background:#fff;color:#111}
.card input{width:100%}
.note{margin:4px 0;color:var(--muted);font-size:12px}
.err{min-height:1.5em;margin:6px 0;color:#d03b3b}
#chat{position:relative;display:flex;flex:1;min-height:0;background:var(--page)}
aside{flex:none;width:190px;overflow-y:auto;padding-bottom:8px;background:var(--panel)}
#rooms{border-right:1px solid var(--line)}#members{border-left:1px solid var(--line)}
.item{display:block;width:100%;padding:3px 10px;text-align:left;color:var(--ink);background:none;border:0;border-radius:0;box-shadow:none}
.item.on{color:#fff;font-weight:bold;background:linear-gradient(var(--bar1),var(--bar2))}
.m{display:flex;gap:6px;align-items:center;padding:2px 10px}.m.off{opacity:.55}
.dot{width:10px;height:10px;flex:none;border-radius:50%}
#center{display:flex;flex:1;flex-direction:column;min-width:0}
#top,#send{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel)}
#top{border-bottom:1px solid var(--line)}#send{border-top:1px solid var(--line)}
#top .sp{flex:1}#status{color:var(--muted);font-size:12px}
#log{flex:1;overflow-y:auto;padding:8px 12px}
.msg{display:flex;gap:8px;margin:0 0 8px}
.av{display:flex;flex:none;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:bold;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.who{font-weight:bold}.ts{margin-left:6px;color:var(--muted);font-size:11px}
.body{overflow-wrap:anywhere;white-space:pre-wrap}
.x{display:none;margin-left:6px;padding:0 5px;font-size:11px}.msg:hover .x{display:inline-block}
#typing{min-height:20px;padding:0 12px;color:var(--muted);font-size:12px}
#text{flex:1}#membtn{display:none}
@media(max-width:720px){aside{width:120px}#members{display:none;position:absolute;top:0;right:0;bottom:0;z-index:3;width:170px;box-shadow:-2px 0 8px rgba(0,0,0,.25)}#members.show{display:block}#membtn{display:inline-block}}
</style>
</head>
<body class="app">
<div id="page">
<nav>
<a href="start.html">Home</a>
<a href="select.html">Games</a>
<a href="anime.html">Anime</a>
<a href="movies.html">Movies/Series</a>
<a href="search.html">Search</a>
<a href="tools.html">Tools</a>
<a href="chat.html" class="start" aria-current="page">Chat</a>
<a href="settings.html">Settings</a>
<a href="about-us.html">About us</a>
</nav>

<div id="auth" hidden>
  <form id="authform" class="card">
    <h1 id="atitle">Log in</h1>
    <label for="u">Username</label><input id="u" maxlength="20" autocomplete="username" required>
    <p class="note" id="unote" hidden>3 to 20 letters, numbers or underscores.</p>
    <label for="p">Password</label><input id="p" type="password" maxlength="128" autocomplete="current-password" required>
    <p class="note" id="pnote" hidden>At least 8 characters. There is no password reset, so remember it.</p>
    <p id="err" class="err"></p>
    <p><button class="go" id="asubmit">Log in</button> <a href="#" id="swap">Create an account</a></p>
  </form>
</div>

<div id="chat" hidden>
  <aside id="rooms"></aside>
  <section id="center">
    <div id="top">
      <strong id="rname"></strong><span id="status"></span><span class="sp"></span>
      <label for="color">Colour</label><select id="color"></select>
      <button id="membtn" type="button">Members</button><button id="out" type="button">Log out</button>
    </div>
    <div id="log"></div>
    <div id="typing"></div>
    <form id="send"><input id="text" maxlength="500" placeholder="Message" autocomplete="off"><button class="go">Send</button></form>
  </section>
  <aside id="members"></aside>
</div>
</div>

<!-- Local copy first (school networks often block CDNs): put the file at vendor/supabase.js -->
<script src="vendor/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://rdmvncnjmnpjqixfuzpt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rlTlh1l60XasCYbApw1QcA_zWU33wgM'; // publishable key only, never the secret key
const EMAIL_DOMAIN = 'pastpapergenie.co.uk'; // usernames become username@this-domain for Supabase Auth; no email is ever sent
const COLORS = [['Blue', '#2a6ec2'], ['Pink', '#d63384'], ['Green', '#2a9a2a'], ['Gold', '#c98a00'], ['Purple', '#7b3fb8'], ['Teal', '#0f9d9d'], ['Orange', '#e8710a'], ['Red', '#d03b3b']]; // must match the SQL check

const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let sb, me, room = 'general', token = 0, chan = null, lobby = null;
let profiles = {}, onlineIds = new Set(), typers = {}, mode = 'login', lastTyping = 0;

const setStatus = t => { $('#status').textContent = t; };
const flash = t => { setStatus(t); setTimeout(() => setStatus(''), 3000); };

function loadLib(cb) {
  if (window.supabase && window.supabase.createClient) return cb();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  s.onload = cb;
  s.onerror = () => { $('#auth').hidden = false; $('#err').textContent = 'Could not load the chat library. Your network may be blocking it.'; };
  document.head.appendChild(s);
}

async function ensureProfiles(ids) {
  const need = [...new Set(ids)].filter(i => i && !profiles[i]);
  if (!need.length) return;
  const { data } = await sb.from('profiles').select('id,username,color,is_admin').in('id', need);
  (data || []).forEach(p => { profiles[p.id] = p; });
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#auth').hidden = false; $('#chat').hidden = true; return; }
  const { data: prof } = await sb.from('profiles').select('id,username,color,is_admin').eq('id', session.user.id).maybeSingle();
  if (!prof) { await sb.auth.signOut(); $('#auth').hidden = false; return; }   // e.g. leftover anonymous session
  me = prof; profiles[me.id] = me;
  $('#auth').hidden = true; $('#chat').hidden = false;

  const { data: rs } = await sb.from('rooms').select('id').order('position');
  const names = (rs || []).map(r => r.id);
  if (!names.includes(room)) room = names[0] || 'general';
  $('#rooms').replaceChildren(h('h2', '', 'Rooms'), ...names.map(n => {
    const b = h('button', 'item', '# ' + n); b.dataset.room = n; b.onclick = () => goRoom(n); return b;
  }));
  $('#color').replaceChildren(...COLORS.map(([n, c]) => { const o = h('option', '', n); o.value = c; return o; }));
  $('#color').value = me.color;

  const { data: all } = await sb.from('profiles').select('id,username,color,is_admin').order('username').limit(1000);
  (all || []).forEach(p => { profiles[p.id] = p; });
  startLobby();
  goRoom(room);
}

// Online list (presence) and live profile changes
function startLobby() {
  if (lobby) sb.removeChannel(lobby);
  lobby = sb.channel('lobby', { config: { presence: { key: me.id } } });
  lobby
    .on('presence', { event: 'sync' }, async () => {
      onlineIds = new Set(Object.keys(lobby.presenceState()));
      await ensureProfiles([...onlineIds]);
      renderMembers();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, p => {
      if (p.new && p.new.id) { profiles[p.new.id] = p.new; if (p.new.id === me.id) me = p.new; renderMembers(); }
    })
    .subscribe(async st => { if (st === 'SUBSCRIBED') await lobby.track({ at: Date.now() }); });
  renderMembers();
}

async function goRoom(n) {
  const my = ++token;
  room = n; typers = {};
  $('#log').replaceChildren(); $('#typing').textContent = ''; $('#rname').textContent = '# ' + n;
  document.querySelectorAll('.item').forEach(b => b.classList.toggle('on', b.dataset.room === n));

  if (chan) { sb.removeChannel(chan); chan = null; }
  chan = sb.channel('room:' + n, { config: { broadcast: { self: false } } })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + n },
      async p => { await ensureProfiles([p.new.user_id]); if (my === token) add(p.new); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' },
      p => document.querySelector('[data-id="' + p.old.id + '"]')?.remove())
    .on('broadcast', { event: 'typing' }, ({ payload }) => { if (payload && payload.id !== me.id) typers[payload.name] = Date.now(); })
    .subscribe(st => {
      if (my !== token) return;
      if (st === 'SUBSCRIBED') setStatus('');
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setStatus('Reconnecting…');
    });

  const { data, error } = await sb.from('messages').select('*').eq('room', n)
    .order('created_at', { ascending: false }).limit(50);
  if (my !== token) return;
  if (error) return flash(error.message);
  const rows = data.reverse();
  await ensureProfiles(rows.map(r => r.user_id));
  if (my !== token) return;
  rows.forEach(add);
  $('#log').scrollTop = 1e9;
}

function add(m) {
  if (document.querySelector('[data-id="' + m.id + '"]')) return;
  const p = profiles[m.user_id] || { username: '?', color: '#888' };
  const d = h('div', 'msg'), col = h('div'), head = h('div'), av = h('div', 'av', p.username[0].toUpperCase());
  d.dataset.id = m.id; av.style.background = p.color;
  head.append(h('span', 'who', p.username), h('span', 'ts', new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })));
  if (m.user_id === me.id || me.is_admin) {
    const x = h('button', 'x', '✕'); x.title = 'Delete';
    x.onclick = async () => {
      const { error } = await sb.from('messages').delete().eq('id', m.id);
      if (error) flash(error.message); else d.remove();
    };
    head.append(x);
  }
  col.append(head, h('div', 'body', m.content)); d.append(av, col);
  const L = $('#log'), stick = L.scrollTop + L.clientHeight >= L.scrollHeight - 40;
  L.append(d); if (stick) L.scrollTop = L.scrollHeight;
}

function renderMembers() {
  const box = $('#members'); box.replaceChildren();
  const on = [], off = [];
  Object.values(profiles).sort((a, b) => a.username.localeCompare(b.username))
    .forEach(p => (onlineIds.has(p.id) ? on : off).push(p));
  for (const [label, list, isOff, total] of [['Online', on, 0, on.length], ['Offline', off.slice(0, 100), 1, off.length]]) {
    box.append(h('h2', '', label + ' — ' + total));
    for (const u of list) {
      const r = h('div', 'm' + (isOff ? ' off' : '')), d = h('span', 'dot');
      d.style.background = u.color; r.append(d, h('span', '', u.username + (u.is_admin ? ' ★' : ''))); box.append(r);
    }
  }
}

function renderTyping() {
  const n = Object.keys(typers).filter(k => Date.now() - typers[k] < 4000);
  $('#typing').textContent = !n.length ? '' : n.length > 2 ? 'Several people are typing…' : n.join(' and ') + (n.length > 1 ? ' are' : ' is') + ' typing…';
}
setInterval(renderTyping, 1000);

$('#send').onsubmit = async e => {
  e.preventDefault();
  const t = $('#text').value.trim();
  if (!t) return;
  $('#text').value = '';
  const { error } = await sb.from('messages').insert({ room, content: t });
  if (error) { $('#text').value = t; flash(error.message); }
};
$('#text').oninput = () => {
  if (chan && Date.now() - lastTyping > 2000) {
    lastTyping = Date.now();
    chan.send({ type: 'broadcast', event: 'typing', payload: { id: me.id, name: me.username } });
  }
};
$('#color').onchange = async e => {
  const { error } = await sb.from('profiles').update({ color: e.target.value }).eq('id', me.id);
  if (error) flash(error.message); else me.color = e.target.value;
};
$('#out').onclick = () => sb.auth.signOut().then(() => location.reload());
$('#membtn').onclick = () => $('#members').classList.toggle('show');

$('#swap').onclick = e => {
  e.preventDefault();
  mode = mode === 'login' ? 'register' : 'login';
  const r = mode === 'register';
  $('#atitle').textContent = $('#asubmit').textContent = r ? 'Create account' : 'Log in';
  $('#swap').textContent = r ? 'I already have an account' : 'Create an account';
  $('#unote').hidden = $('#pnote').hidden = !r;
  $('#p').autocomplete = r ? 'new-password' : 'current-password'; $('#err').textContent = '';
};

$('#authform').onsubmit = async e => {
  e.preventDefault();
  const err = $('#err'), btn = $('#asubmit');
  const u = $('#u').value.trim(), pw = $('#p').value;
  err.textContent = '';
  if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) { err.textContent = 'Username must be 3 to 20 letters, numbers or underscores.'; return; }
  if (mode === 'register' && pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  const email = u.toLowerCase() + '@' + EMAIL_DOMAIN;
  btn.disabled = true;
  try {
    let r;
    if (mode === 'register') r = await sb.auth.signUp({ email, password: pw, options: { data: { username: u } } });
    else r = await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) {
      const m = r.error.message || '';
      err.textContent = /already registered|Database error|duplicate/i.test(m) ? 'That username is taken.'
        : /invalid login/i.test(m) ? 'Wrong username or password.'
        : /rate limit|too many/i.test(m) ? 'Too many attempts. Wait a minute and try again.'
        : m;
    } else if (!r.data.session) {
      err.textContent = 'Account created, but email confirmation is still switched on in Supabase. Turn it off (see setup notes).';
    } else {
      $('#p').value = '';
      await boot();
    }
  } catch (x) { err.textContent = 'Could not reach the chat server.'; }
  btn.disabled = false;
};

loadLib(() => { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); boot(); });

// Same tab cloak + panic key as the other pages
(function () {
  var V = { google: ['Google', 'https://www.google.com/favicon.ico'], vocab: ['My Learning | Vocabulary.com', 'https://www.vocabulary.com/favicon.ico'], canvas: ['Canvas', 'https://canvas.instructure.com/favicon.ico'], drive: ['Google Drive', 'https://drive.google.com/favicon.ico'], docs: ['Google Docs', 'https://docs.google.com/favicon.ico'] }, v;
  try { v = V[localStorage.getItem('tabCloaker')]; } catch (e) {}
  if (v) { document.title = v[0]; document.querySelector("link[rel~='icon']").href = v[1]; }
})();
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  var k = 'k', go = true, u = 'https://classroom.google.com';
  try { k = localStorage.getItem('dotgui_panic_key') || k; go = (localStorage.getItem('dotgui_panic_redirect') || 'true') === 'true'; u = localStorage.getItem('dotgui_panic_url') || u; } catch (x) {}
  if ((e.key || '').toLowerCase() !== k.toLowerCase()) return;
  document.title = 'Google';
  var f = document.querySelector("link[rel~='icon']"); if (f) f.href = 'https://www.google.com/favicon.ico';
  if (go) location.href = u;
});
</script>
</body>
</html>
